<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <style>body { margin: 0; background-color: transparent; }</style>
</head>
<body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // Configuração básica da cena transparente para o OBS
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Adicionando um cubo provisório representando a cobra até carregar o modelo GLB
        const geometry = new THREE.BoxGeometry();
        const material = new THREE.MeshBasicMaterial({ color: 0x00ff00 });
        const cobra = new THREE.Mesh(geometry, material);
        scene.add(cobra);

        camera.position.z = 5;

        function animate() {
            requestAnimationFrame(animate);
            cobra.rotation.y += 0.01; // Animação simples de movimento
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
