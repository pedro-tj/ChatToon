<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>ET 3D Live Chat - Completo</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent; /* Fundo transparente para o OBS */
        }
        /* Balão de fala estilo quadrinho acima do personagem */
        #chat-bubble {
            position: absolute;
            top: 1%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #aaff00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 40px;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 15px;
            border: 2px solid #ff66cc;
            max-width: 700px;
            text-align: center;
            box-shadow: 0px 14px 35px rgba(255, 102, 204, 0.3);
            display: none; /* Só aparece quando houver mensagem */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="chat-bubble">Aguardando mensagens do chat...</div>

    <!-- Importando o Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Configuração da Cena 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1.2);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // 2. Construção do Personagem Completo (Cabeça Verde, Olhos Pretos, Corpo, Braços e Pernas Rosas)
        const etGroup = new THREE.Group();

        // Materiais conforme solicitado
        const materialCabeca = new THREE.MeshPhongMaterial({ color: 0x00aa06, shininess: 100 });
        const materialCorpo = new THREE.MeshPhongMaterial({ color: 0xff66cc, shininess: 180 });
        const materialOlho = new THREE.MeshBasicMaterial({ color: 0x000000 });

        // Cabeça (Verde e achatada estilo ET)
        const cabecaGeo = new THREE.SphereGeometry(1.0, 20, 32);
        const cabeca = new THREE.Mesh(cabecaGeo, materialCabeca);
        cabeca.scale.set(1.4, 0.7, 1.1);
        cabeca.position.y = 1.7;

        // Olhos pretos grandes presos na cabeça
        const olhoGeo = new THREE.SphereGeometry(0.32, 16, 16);
        const olhoEsq = new THREE.Mesh(olhoGeo, materialOlho);
        olhoEsq.scale.set(0.8, 1.3, 0.8);
        olhoEsq.position.set(0.45, 0.05, 0.85);
        olhoEsq.rotation.z = -0.2;

        const olhoDir = new THREE.Mesh(olhoGeo, materialOlho);
        olhoDir.scale.set(0.8, 1.3, 0.8);
        olhoDir.position.set(-0.45, 0.05, 0.85);
        olhoDir.rotation.z = 0.2;

        cabeca.add(olhoEsq);
        cabeca.add(olhoDir);
        etGroup.add(cabeca);

        // Pescoço
        const pescocoGeo = new THREE.CylinderGeometry(0.2, 0.25, 0.4, 16);
        const pescoco = new THREE.Mesh(pescocoGeo, materialCorpo);
        pescoco.position.y = 1.1;
        etGroup.add(pescoco);

        // Tronco (Corpo Rosa)
        const troncoGeo = new THREE.CylinderGeometry(0.6, 0.5, 1.4, 32);
        const tronco = new THREE.Mesh(troncoGeo, materialCorpo);
        tronco.position.y = 0.2;
        etGroup.add(tronco);

        // Função auxiliar para criar articulações/esferas (ombros, juntas)
        function criarArticulacao() {
            return new THREE.Mesh(new THREE.SphereGeometry(0.2, 16, 16), materialCorpo);
        }

        // Braço Esquerdo
        const ombroEsq = criarArticulacao();
        ombroEsq.position.set(0.75, 0.7, 0);
        const bracoEsqGeo = new THREE.CylinderGeometry(0.12, 0.1, 1.1, 16);
        const bracoEsq = new THREE.Mesh(bracoEsqGeo, materialCorpo);
        bracoEsq.position.set(0, -0.5, 0);
        ombroEsq.add(bracoEsq);
        etGroup.add(ombroEsq);

        // Braço Direito
        const ombroDir = criarArticulacao();
        ombroDir.position.set(-0.75, 0.7, 0);
        const bracoDirGeo = new THREE.CylinderGeometry(0.12, 0.1, 1.1, 16);
        const bracoDir = new THREE.Mesh(bracoDirGeo, materialCorpo);
        bracoDir.position.set(0, -0.5, 0);
        ombroDir.add(bracoDir);
        etGroup.add(ombroDir);

        // Perna Esquerda
        const quadrilEsq = criarArticulacao();
        quadrilEsq.position.set(0.3, -0.6, 0);
        const pernaEsqGeo = new THREE.CylinderGeometry(0.14, 0.11, 1.2, 16);
        const pernaEsq = new THREE.Mesh(pernaEsqGeo, materialCorpo);
        pernaEsq.position.set(0, -0.6, 0);
        quadrilEsq.add(pernaEsq);
        etGroup.add(quadrilEsq);

        // Perna Direita
        const quadrilDir = criarArticulacao();
        quadrilDir.position.set(-0.3, -0.6, 0);
        const pernaDirGeo = new THREE.CylinderGeometry(0.14, 0.11, 1.2, 16);
        const pernaDir = new THREE.Mesh(pernaDirGeo, materialCorpo);
        pernaDir.position.set(0, -0.6, 0);
        quadrilDir.add(pernaDir);
        etGroup.add(quadrilDir);

        scene.add(etGroup);
        camera.position.z = 6.5;
        camera.position.y = 0.6;

        // 3. Animação de Movimento e Fala
        let clock = new THREE.Clock();
        let falandoTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            // Movimento suave de flutuação e balanço
            etGroup.position.y = Math.sin(time * 2) * 0.1 + (falandoTimer > 0 ? Math.sin(time * 20) * 0.04 : 0);
            etGroup.rotation.y = Math.sin(time * 0.8) * 0.15;
            
            // Animação de fala (inclina a cabeça e mexe levemente os braços)
            if (falandoTimer > 0) {
                cabeca.rotation.z = Math.sin(time * 15) * 0.08;
                ombroEsq.rotation.z = Math.sin(time * 12) * 0.1;
                ombroDir.rotation.z = -Math.sin(time * 12) * 0.1;
                falandoTimer -= 0.016;
            } else {
                cabeca.rotation.z = 0;
                ombroEsq.rotation.z = 0;
                ombroDir.rotation.z = 0;
            }

            renderer.render(scene, camera);
        }
        animate();

        // 4. Configuração de Vozes (SpeechSynthesis)
        let vozesDisponiveis = [];

        function carregarVozes() {
            vozesDisponiveis = window.speechSynthesis.getVoices();
        }

        window.speechSynthesis.onvoiceschanged = carregarVozes;
        carregarVozes();

        // 5. Leitura do Chat e Síntese de Voz
        let ultimaMensagemLida = "";

        async function verificarChat() {
            try {
                let response = await fetch('chat_recente.txt?' + new Date().getTime());
                if (response.ok) {
                    let texto = await response.text();
                    if (texto.trim() !== "" && texto !== ultimaMensagemLida) {
                        ultimaMensagemLida = texto;
                        
                        let bubble = document.getElementById('chat-bubble');
                        let textoFala = texto.replace("ET: ", "");
                        bubble.innerText = texto;
                        bubble.style.display = 'block';
                        falandoTimer = 4; // Ativa a animação de fala por 4 segundos

                        if ('speechSynthesis' in window) {
                            window.speechSynthesis.cancel();
                            let utterance = new SpeechSynthesisUtterance(textoFala);
                            utterance.rate = 1.1; 
                            utterance.pitch = 1.2; 

                            if (vozesDisponiveis.length === 0) {
                                carregarVozes();
                            }
                            let vozPt = vozesDisponiveis.find(v => v.lang.includes('pt') || v.lang.includes('PT'));
                            if (vozPt) {
                                utterance.voice = vozPt;
                            }

                            window.speechSynthesis.speak(utterance);
                        }
                    }
                }
            } catch (e) {
                // Ignora erros temporários de leitura
            }
        }

        setInterval(verificarChat, 1500);
    </script>
</body>
</html>
