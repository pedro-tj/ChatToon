<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ChatToon overlay</title>
  <link rel="stylesheet" href="static/overlay/overlay.css">
</head>
<body>
  <canvas id="stage" aria-label="Animated avatar"></canvas>
  <div id="bubble" role="status" aria-live="polite">
    <div class="head"><span class="platform"></span><span class="author"></span><span class="label"></span></div>
    <div class="text"></div>
    <div class="dots" aria-hidden="true"><i></i><i></i><i></i></div>
  </div>
  <div id="badge" hidden></div>
  <script type="module" src="static/overlay/overlay.js"></script>
</body>
</html>
