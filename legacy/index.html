<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>lagarta 3D Live Chat</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: transparent; /* Fundo transparente para o OBS */
        }
        /* Balão de fala estilo quadrinho acima da lagarta */
        #chat-bubble {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            color: #00aa00;
            font-family: 'Courier New', Courier, monospace;
            font-size: 20px;
            font-weight: bold;
            padding: 12px 24px;
            border-radius: 15px;
            border: 2px solid #00ffcc;
            max-width: 800px;
            text-align: center;
            box-shadow: 0px 4px 15px rgba(0, 255, 204, 0.3);
            display: none; /* Só aparece quando houver mensagem */
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="chat-bubble">Aguardando mensagens do chat...</div>

    <!-- Importando o Three.js via CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script>
        // 1. Configuração da Cena 3D
        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // Iluminação
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 1.2);
        pointLight.position.set(5, 5, 5);
        scene.add(pointLight);

        // 2. Construção da Cobra (Corpo em Gominhos articulados)
        const lagartaGroup = new THREE.Group();
        const segmentos = [];
        const numPartes = 10;
        
        const materialCabeca = new THREE.MeshPhongMaterial({ color: 0xff66cc, shininess: 100 });
        const materialCorpo = new THREE.MeshPhongMaterial({ color: 0xff66cc, shininess: 180 });
        const materialOlho = new THREE.MeshBasicMaterial({ color: 0x000000 });

        for (let i = 0; i < numPartes; i++) {
            let geom = (i === 0) ? new THREE.SphereGeometry(0.6, 32, 32) : new THREE.SphereGeometry(0.45 - (i*0.02), 16, 16);
            let mat = (i === 0) ? materialCabeca : materialCorpo;
            let parte = new THREE.Mesh(geom, mat);
            parte.position.z = -i * 0.7;
            lagartaGroup.add(parte);
            segmentos.push(parte);
        }

        // Olhos da lagarta presos na CABEÇA (segmentos[0]) para acompanharem o movimento exato
        const olhoGeo = new THREE.SphereGeometry(0.12, 8, 8);
        const olhoEsq = new THREE.Mesh(olhoGeo, materialOlho);
        olhoEsq.position.set(0.3, 0.25, 0.45);
        
        const olhoDir = new THREE.Mesh(olhoGeo, materialOlho);
        olhoDir.position.set(-0.3, 0.25, 0.45);

        // Adiciona os olhos diretamente na cabeça da lagarta
        segmentos[0].add(olhoEsq);
        segmentos[0].add(olhoDir);

        scene.add(lagartaGroup);
        camera.position.z = 7;
        camera.position.y = 1;

        // 3. Animação de Movimento Fluido
        let clock = new THREE.Clock();
        let falandoTimer = 0;

        function animate() {
            requestAnimationFrame(animate);
            let time = clock.getElapsedTime();

            for (let i = segmentos.length - 1; i > 0; i--) {
                let targetX = segmentos[i-1].position.x;
                let targetY = segmentos[i-1].position.y;
                segmentos[i].position.x += (targetX - segmentos[i].position.x) * 0.2;
                segmentos[i].position.y += (targetY - segmentos[i].position.y) * 0.2;
            }

            segmentos[0].position.x = Math.sin(time * 1.5) * 1.2;
            segmentos[0].position.y = Math.cos(time * 2) * 0.4 + (falandoTimer > 0 ? Math.sin(time * 15) * 0.15 : 0);
            lagartaGroup.rotation.y = Math.sin(time * 0.8) * 0.3;

            if (falandoTimer > 0) falandoTimer -= 0.016;

            renderer.render(scene, camera);
        }
        animate();

        // 4. Configuração e Carregamento de Vozes para o SpeechSynthesis
        let vozesDisponiveis = [];

        function carregarVozes() {
            vozesDisponiveis = window.speechSynthesis.getVoices();
        }

        window.speechSynthesis.onvoiceschanged = carregarVozes;
        carregarVozes();

        // 5. Leitura do Arquivo de Chat e Síntese de Voz Atualizada
        let ultimaMensagemLida = "";

        async function verificarChat() {
            try {
                let response = await fetch('chat_recente.txt?' + new Date().getTime());
                if (response.ok) {
                    let texto = await response.text();
                    if (texto.trim() !== "" && texto !== ultimaMensagemLida) {
                        ultimaMensagemLida = texto;
                        
                        let bubble = document.getElementById('chat-bubble');
                        let textoFala = texto.replace("Cobra: ", "");
                        bubble.innerText = texto;
                        bubble.style.display = 'block';
                        falandoTimer = 4; // ativa a animação de "falando"

                        // Executa a fala com suporte a voz em português
                        if ('speechSynthesis' in window) {
                            window.speechSynthesis.cancel();
                            let utterance = new SpeechSynthesisUtterance(textoFala);
                            utterance.rate = 1.1; 
                            utterance.pitch = 0.8; // Tom mais grave para a lagarta

                            // Tenta encontrar uma voz em português disponível
                            if (vozesDisponiveis.length === 0) {
                                carregarVozes();
                            }
                            let vozPt = vozesDisponiveis.find(v => v.lang.includes('pt') || v.lang.includes('PT'));
                            if (vozPt) {
                                utterance.voice = vozPt;
                            }

                            window.speechSynthesis.speak(utterance);
                        }
                    }
                }
            } catch (e) {
                // Ignora erros de leitura temporários
            }
        }

        setInterval(verificarChat, 1500);
    </script>
</body>
</html>
